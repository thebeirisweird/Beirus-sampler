name: Build Native Android App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip Project
      run: unzip -q "BeirusSampler_Fixed (1).zip" -d workspace

    - name: Find Gradle and Build
      run: |
        # Search the entire zip file for the gradlew tool
        GRADLE_PATH=$(find workspace -name "gradlew" | head -n 1)
        
        # If it can't find it, print out everything in the zip so we can see what's wrong
        if [ -z "$GRADLE_PATH" ]; then
          echo "Could not find gradlew! Printing the contents of the zip file:"
          find workspace
          exit 1
        fi
        
        # If it finds it, open that folder and build the app!
        APP_DIR=$(dirname "$GRADLE_PATH")
        cd "$APP_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Save APK for Download
      uses: actions/upload-artifact@v4
      with:
        name: Beirus-Sampler-APK
        path: workspace/**/*.apk
        
        npm install
        npm run build
        npx cap sync android
        
        # Saves this exact folder path for the Gradle step
        echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV

    - name: Build APK with Gradle
      run: |
        cd "$APP_DIR/android"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Save APK for Download
      uses: actions/upload-artifact@v4
      with:
        name: Beirus-Sampler-APK
        # This wildcard setup grabs the final APK no matter what folder it ended up in
        path: workspace/**/*.apk
