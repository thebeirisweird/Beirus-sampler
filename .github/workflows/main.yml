name: Build Capacitor Sampler App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip Project
      # Extracts your uploaded zip into a folder called 'workspace'
      run: unzip -q *.zip -d workspace

    - name: Install and Sync Capacitor
      run: |
        cd workspace
        # Installs all the necessary web and capacitor packages
        npm install
        # Builds the web code
        npm run build
        # Syncs the web code into the Android folder
        npx cap sync android

    - name: Build APK with Gradle
      run: |
        # Navigates into the android folder created/synced by Capacitor
        cd workspace/android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Save APK for Download
      uses: actions/upload-artifact@v4
      with:
        name: Beirus-Sampler-APK
        path: workspace/android/app/build/outputs/apk/debug/**/*.apk
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Build with Gradle
        run: ./gradlew assembleDebug
