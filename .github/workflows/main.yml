name: Build Native Android App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip Project
      run: unzip -q "BeirusSampler_Fixed.zip" -d workspace

    - name: Fix Whitespace, Repair, and Build
      run: |
        # Find the gradlew file
        GRADLE_PATH=$(find workspace -name "gradlew" | head -n 1)
        
        # Get the weird folder name that has the invisible space
        WEIRD_DIR=$(dirname "$GRADLE_PATH")
        
        # Rename that folder to a safe name with no spaces!
        mv "$WEIRD_DIR" safe_android_project
        cd safe_android_project
        
        # Repair the broken file and build the app
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Save APK for Download
      uses: actions/upload-artifact@v4
      with:
        name: Beirus-Sampler-APK
        path: safe_android_project/**/*.apk
